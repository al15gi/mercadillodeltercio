<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Mercadillo del Tercio</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f2;color:#171717}.wrap{max-width:1150px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e4e4df;border-radius:18px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fafafa;border:1px solid #eee;padding:12px;border-radius:12px}.stat b{display:block;font-size:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.active{background:#111;color:#fff}.hidden{display:none!important}input,textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff}.danger{background:#ffe1e1;color:#900}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.msg{display:none;background:#eff7d7;padding:10px;border-radius:9px}.msg.on{display:block}@media(max-width:850px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.stats{grid-template-columns:1fr}}</style>
</head><body><div class="wrap"><div class="top"><h2>Mercadillo del Tercio · Admin</h2><button id="logout" class="btn">Salir</button></div>
<section id="login" class="card"><h1>Panel de administración</h1><input id="pass" type="password" placeholder="Contraseña"><button id="go" class="btn primary" style="margin-top:10px">Entrar</button><div id="loginMsg" class="msg"></div></section>
<section id="panel" class="hidden"><div id="msg" class="msg"></div>
<div class="card"><div class="stats"><div class="stat">Ventas<b id="sales">0 €</b></div><div class="stat">Pedidos<b id="ordersCount">0</b></div><div class="stat">Productos<b id="productsCount">0</b></div><div class="stat">Poco stock<b id="low">0</b></div><div class="stat">Pendientes<b id="pending">0</b></div><div class="stat">Entregados<b id="delivered">0</b></div></div></div>
<div class="tabs"><button class="tab active" data-tab="productsTab">🛍️ Productos</button><button class="tab" data-tab="ordersTab">📦 Historial y estados</button><button class="tab" data-tab="couponsTab">🎟️ Cupones</button></div>
<section id="productsTab"><div class="card"><h2>Añadir producto</h2><form id="addForm"><div class="grid"><label>Nombre<input required id="productName"></label><label>Precio<input required id="productPrice" type="number" min="0" step="0.01"></label><label>Precio anterior<input id="oldPrice" type="number" min="0" step="0.01"></label><label>Categoría<input id="category"></label><label>Stock<input required id="stock" type="number" min="0"></label><label>Emoji<input id="emoji"></label><label>Foto URL<input id="image"></label></div><label>Descripción<textarea id="description"></textarea></label><label><input id="featured" type="checkbox" style="width:auto"> Destacado</label><label><input id="isNew" type="checkbox" checked style="width:auto"> Nuevo</label><br><button class="btn primary">Añadir producto</button></form></div><div class="card"><h2>Productos</h2><div id="products" class="table"></div></div></section>
<section id="ordersTab" class="hidden"><div class="card"><h2>Historial de pedidos</h2><div id="orders" class="table"></div></div></section>
<section id="couponsTab" class="hidden"><div class="card"><h2>Cupones</h2><form id="couponForm" class="grid"><label>Código<input required id="couponCode"></label><label>Tipo<select id="couponType"><option value="percent">%</option><option value="fixed">€</option></select></label><label>Valor<input required id="couponValue" type="number" min="0" step="0.01"></label><div><br><button class="btn primary">Añadir</button></div></form><div id="coupons" class="table"></div></div></section>
</section></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwbwCPAaHm83HLa119PATjGNv47aF8_5I6Bl8PVzFWfNz8BLe99-VINh3l9AlOP0bTw6A/exec";
let password=sessionStorage.getItem("mdt-admin-password")||"";
function jsonp(url){return new Promise((resolve,reject)=>{const cb="adm_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script");window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(Error("connection"))};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.body.appendChild(s)})}
function post(d){return fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(d)})}
function msg(t){const e=document.getElementById("msg");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function dashboard(){const d=await jsonp(API+"?action=dashboard&password="+encodeURIComponent(password));if(!d.ok)return;document.getElementById("sales").textContent=Number(d.stats.sales).toFixed(2).replace(".",",")+" €";document.getElementById("ordersCount").textContent=d.stats.orders;document.getElementById("productsCount").textContent=d.stats.products;document.getElementById("low").textContent=d.stats.low;document.getElementById("pending").textContent=d.stats.pending;document.getElementById("delivered").textContent=d.stats.delivered}
async function loadProducts(){const d=await jsonp(API+"?action=list");if(!d.ok)return;document.getElementById("products").innerHTML="<table><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Acciones</th></tr>"+d.products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.desc||"")}</small></td><td><input id="pr${p.id}" value="${p.price}"></td><td><input id="st${p.id}" value="${p.stock}"></td><td><input id="ca${p.id}" value="${esc(p.category||"Otros")}"></td><td><button class="btn primary" onclick="saveProduct(${p.id})">Guardar</button> <button class="btn danger" onclick="deleteProduct(${p.id})">Eliminar</button></td></tr>`).join("")+"</table>"}
async function saveProduct(id){await post({action:"edit",password,id,price:document.getElementById("pr"+id).value,stock:document.getElementById("st"+id).value,category:document.getElementById("ca"+id).value});msg("Guardado ✅");setTimeout(()=>{loadProducts();dashboard()},700)}
async function deleteProduct(id){if(!confirm("¿Eliminar?"))return;await post({action:"delete",password,id});msg("Eliminado ✅");setTimeout(()=>{loadProducts();dashboard()},700)}
async function loadOrders(){const d=await jsonp(API+"?action=orders&password="+encodeURIComponent(password));if(!d.ok)return;document.getElementById("orders").innerHTML="<table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr>"+d.orders.map(o=>`<tr><td>${esc(o.id)}<br><small>${new Date(o.date).toLocaleString()}</small></td><td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address)}</td><td>${Number(o.total||0).toFixed(2).replace(".",",")} €</td><td><select onchange="statusOrder('${esc(o.id)}',this.value)">${["pendiente","preparando","enviado","entregado","cancelado"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+"</table>"}
async function statusOrder(id,status){await post({action:"status",password,id,status});msg("Estado actualizado ✅");setTimeout(()=>{loadOrders();dashboard()},700)}
async function loadCoupons(){const d=await jsonp(API+"?action=list");if(!d.ok)return;document.getElementById("coupons").innerHTML="<table><tr><th>Código</th><th>Tipo</th><th>Valor</th></tr>"+d.coupons.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.type)}</td><td>${c.value}</td></tr>`).join("")+"</table>"}
document.getElementById("go").onclick=async()=>{const v=document.getElementById("pass").value.trim();if(!v)return;try{const d=await jsonp(API+"?action=auth&password="+encodeURIComponent(v));if(!d.ok){document.getElementById("loginMsg").textContent="Contraseña incorrecta";document.getElementById("loginMsg").classList.add("on");return}password=v;sessionStorage.setItem("mdt-admin-password",password);document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");dashboard();loadProducts()}catch(e){document.getElementById("loginMsg").textContent="No se pudo conectar";document.getElementById("loginMsg").classList.add("on")}};
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click()});document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("mdt-admin-password");location.reload()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["productsTab","ordersTab","couponsTab"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==b.dataset.tab));if(b.dataset.tab==="ordersTab")loadOrders();if(b.dataset.tab==="couponsTab")loadCoupons()});
document.getElementById("addForm").onsubmit=async e=>{e.preventDefault();await post({action:"add",password,name:document.getElementById("productName").value,price:document.getElementById("productPrice").value,oldPrice:document.getElementById("oldPrice").value,category:document.getElementById("category").value,stock:document.getElementById("stock").value,emoji:document.getElementById("emoji").value,image:document.getElementById("image").value,desc:document.getElementById("description").value,featured:document.getElementById("featured").checked,isNew:document.getElementById("isNew").checked});e.target.reset();document.getElementById("isNew").checked=true;msg("Producto añadido ✅");setTimeout(()=>{loadProducts();dashboard()},700)};
document.getElementById("couponForm").onsubmit=async e=>{e.preventDefault();await post({action:"couponAdd",password,code:document.getElementById("couponCode").value,type:document.getElementById("couponType").value,value:document.getElementById("couponValue").value});e.target.reset();msg("Cupón añadido ✅");setTimeout(loadCoupons,700)};
if(password){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");dashboard();loadProducts()}
</script></body></html>
