<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Mercadillo</title><style>body{margin:0;font-family:system-ui;background:#f5f5f2;color:#171717}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e4df;border-radius:18px;padding:20px;margin-bottom:18px}.top{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:#fafafa;border:1px solid #eee;padding:12px;border-radius:12px}.stat b{display:block;font-size:22px}input,textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff}.danger{background:#ffe1e1;color:#900}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.active{background:#111;color:#fff}.hidden{display:none}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.msg{display:none;background:#eff7d7;padding:10px;border-radius:9px}.msg.on{display:block}@media(max-width:900px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>Mercadillo del Tercio · Admin</h2><button id="logout" class="btn">Salir</button></div>
<section id="login" class="card"><h1>Panel</h1><input id="pass" type="password" placeholder="Contraseña"><button id="go" class="btn primary" style="margin-top:10px">Entrar</button><p id="loginMsg"></p></section>
<section id="panel" class="hidden"><div id="msg" class="msg"></div><div class="card"><div class="stats"><div class="stat">Ventas<b id="sales">0 €</b></div><div class="stat">Pedidos<b id="oc">0</b></div><div class="stat">Productos<b id="pc">0</b></div><div class="stat">Poco stock<b id="low">0</b></div><div class="stat">Pendientes<b id="pending">0</b></div><div class="stat">Entregados<b id="delivered">0</b></div></div></div>
<div class="tabs"><button class="tab active" data-t="p">🛍️ Productos</button><button class="tab" data-t="o">📦 Historial y estados</button><button class="tab" data-t="c">🎟️ Cupones</button></div>
<section id="p"><div class="card"><h2>Añadir producto</h2><form id="add"><div class="grid"><label>Nombre<input required id="n"></label><label>Precio<input required id="pr" type="number" step=".01"></label><label>Precio anterior<input id="old" type="number" step=".01"></label><label>Categoría<input id="cat2"></label><label>Stock<input required id="stock" type="number" min="0"></label><label>Emoji<input id="emoji"></label><label>Foto URL<input id="img"></label></div><label>Descripción<textarea id="desc"></textarea></label><label><input id="feat" type="checkbox" style="width:auto"> Destacado</label> <label><input id="new" type="checkbox" checked style="width:auto"> Nuevo</label><br><button class="btn primary">Añadir producto</button></form></div><div class="card"><h2>Productos</h2><div id="products" class="table"></div></div></section>
<section id="o" class="hidden"><div class="card"><h2>Historial de pedidos</h2><div id="orders" class="table"></div></div></section>
<section id="c" class="hidden"><div class="card"><h2>Cupones</h2><form id="couponForm" class="grid"><label>Código<input required id="cc"></label><label>Tipo<select id="ct"><option value="percent">%</option><option value="fixed">€</option></select></label><label>Valor<input required id="cv" type="number" step=".01"></label><div><br><button class="btn primary">Añadir</button></div></form><div id="coupons" class="table"></div></div></section>
</section></div><script>
const API="https://script.google.com/macros/s/AKfycbwbwCPAaHm83HLa119PATjGNv47aF8_5I6Bl8PVzFWfNz8BLe99-VINh3l9AlOP0bTw6A/exec",J=s=>new Promise((ok,no)=>{let c="x"+Date.now(),t=document.createElement("script");window[c]=d=>{delete window[c];t.remove();ok(d)};t.onerror=()=>{delete window[c];t.remove();no()};t.src=s+(s.includes("?")?"&":"?")+"callback="+c;document.body.appendChild(t)}),POST=x=>fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(x)});
let pw=sessionStorage.getItem("mdt-pw")||"";
function message(t){msg.textContent=t;msg.classList.add("on");setTimeout(()=>msg.classList.remove("on"),2200)}
async function dash(){let d=await J(API+"?action=dashboard&password="+encodeURIComponent(pw));if(d.ok){sales.textContent=Number(d.stats.sales).toFixed(2).replace(".",",")+" €";oc.textContent=d.stats.orders;pc.textContent=d.stats.products;low.textContent=d.stats.low;pending.textContent=d.stats.pending;delivered.textContent=d.stats.delivered}}
async function loadP(){let d=await J(API+"?action=list");products.innerHTML="<table><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Acciones</th></tr>"+d.products.map(x=>`<tr><td>${x.name}</td><td><input id="pr${x.id}" value="${x.price}"></td><td><input id="st${x.id}" value="${x.stock}"></td><td><input id="ca${x.id}" value="${x.category||"Otros"}"></td><td><button class="btn primary" onclick="saveP(${x.id})">Guardar</button> <button class="btn danger" onclick="delP(${x.id})">Eliminar</button></td></tr>`).join("")+"</table>"}
async function saveP(id){await POST({action:"edit",password:pw,id,price:document.getElementById("pr"+id).value,stock:document.getElementById("st"+id).value,category:document.getElementById("ca"+id).value});message("Guardado ✅");setTimeout(()=>{loadP();dash()},600)}
async function delP(id){if(confirm("¿Eliminar?")){await POST({action:"delete",password:pw,id});message("Eliminado ✅");setTimeout(()=>{loadP();dash()},600)}}
async function loadO(){let d=await J(API+"?action=orders&password="+encodeURIComponent(pw));orders.innerHTML="<table><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr>"+d.orders.map(o=>`<tr><td>${o.id}<br>${new Date(o.date).toLocaleString()}</td><td>${o.name}<br>${o.phone}<br>${o.address}</td><td>${Number(o.total).toFixed(2).replace(".",",")} €</td><td><select onchange="st('${o.id}',this.value)">${["pendiente","preparando","enviado","entregado","cancelado"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+"</table>"}
async function st(id,status){await POST({action:"status",password:pw,id,status});message("Estado actualizado y enviado a Telegram ✅");setTimeout(()=>{loadO();dash()},600)}
async function loadC(){let d=await J(API+"?action=list");coupons.innerHTML="<table><tr><th>Código</th><th>Tipo</th><th>Valor</th></tr>"+d.coupons.map(c=>`<tr><td>${c.code}</td><td>${c.type}</td><td>${c.value}</td></tr>`).join("")+"</table>"}
go.onclick=async()=>{pw=pass.value;let d=await J(API+"?action=auth&password="+encodeURIComponent(pw));if(!d.ok){loginMsg.textContent="Contraseña incorrecta";return}sessionStorage.setItem("mdt-pw",pw);login.classList.add("hidden");panel.classList.remove("hidden");dash();loadP()}
logout.onclick=()=>{sessionStorage.removeItem("mdt-pw");location.reload()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["p","o","c"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==b.dataset.t));if(b.dataset.t==="o")loadO();if(b.dataset.t==="c")loadC()});
add.onsubmit=async e=>{e.preventDefault();await POST({action:"add",password:pw,name:n.value,price:pr.value,oldPrice:old.value,category:cat2.value,stock:stock.value,emoji:emoji.value,image:img.value,desc:desc.value,featured:feat.checked,isNew:new.checked});e.target.reset();message("Producto añadido ✅");setTimeout(()=>{loadP();dash()},600)};
couponForm.onsubmit=async e=>{e.preventDefault();await POST({action:"couponAdd",password:pw,code:cc.value,type:ct.value,value:cv.value});e.target.reset();message("Cupón añadido ✅");setTimeout(loadC,600)};
if(pw){login.classList.add("hidden");panel.classList.remove("hidden");dash();loadP()}
</script></body></html>
