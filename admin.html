<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Mercadillo del Tercio</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f2;color:#171717}.wrap{max-width:1150px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:22px;font-weight:900}.logo span{font-weight:500}.card{background:#fff;border:1px solid #e4e4df;border-radius:20px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-size:13px;font-weight:700}input,textarea,select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:800}.primary{background:#171717;color:#fff}.danger{background:#ffe1e1;color:#900}.ghost{background:#eee}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fafafa;border:1px solid #eee;border-radius:14px;padding:14px}.stat b{display:block;font-size:24px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.active{background:#111;color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}.msg{display:none;padding:10px;border-radius:10px;background:#f0f7dc;margin-bottom:12px}.msg.show{display:block}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.stats{grid-template-columns:1fr}}</style></head>
<body><div class="wrap">
<div class="top"><div class="logo">Mercadillo<span>delTercio</span> · Admin</div><button class="btn ghost" id="logout">Cerrar sesión</button></div>
<section id="login" class="card"><h1>Panel de administrador</h1><p>Introduce la contraseña.</p><input id="pass" type="password" placeholder="Contraseña"><br><button class="btn primary" id="go">Entrar</button><div id="loginMsg" class="msg"></div></section>
<section id="panel" class="hidden"><div id="msg" class="msg"></div>
<div class="card"><h2>Resumen</h2><div class="stats"><div class="stat">Ventas<b id="sales">0 €</b></div><div class="stat">Pedidos<b id="oc">0</b></div><div class="stat">Productos<b id="pc">0</b></div><div class="stat">Poco stock<b id="ls">0</b></div></div></div>
<div class="tabs"><button class="tab active" data-tab="p">🛍️ Productos</button><button class="tab" data-tab="o">📦 Pedidos</button></div>
<section id="pTab">
<div class="card"><h2>Añadir producto</h2><form id="add">
<div class="grid"><label>Nombre<input required id="n"></label><label>Precio<input required id="pr" type="number" min="0" step=".01"></label><label>Categoría<input id="cat" placeholder="Pulseras"></label><label>Stock<input required id="stock" type="number" min="0"></label><label>Emoji<input id="emoji" placeholder="📿"></label><label>Foto URL<input id="img" placeholder="https://..."></label></div><label>Descripción<textarea id="desc" rows="2"></textarea><label><input id="feat" type="checkbox" style="width:auto;display:inline"> Destacado</label><br><button class="btn primary">Añadir producto</button></form></div>
<div class="card"><div class="top"><h2>Productos</h2><button class="btn ghost" id="refreshP">Actualizar</button></div><div id="products" class="table">Cargando…</div></div>
</section>
<section id="oTab" class="hidden"><div class="card"><div class="top"><h2>Pedidos</h2><button class="btn ghost" id="refreshO">Actualizar</button></div><div id="orders" class="table">Cargando…</div></div></section>
</section></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxXR3guyd9YLeo1UPDFA3syw6b1BJJ5-S1z3oITFcbf0hVLE_Gau5ZacugayS6QREeXeA/exec";let pw=sessionStorage.getItem("mdt-admin-password")||"";
function j(url){return new Promise((res,rej)=>{const cb="x"+Date.now();const s=document.createElement("script");window[cb]=d=>{delete window[cb];s.remove();res(d)};s.onerror=()=>{delete window[cb];s.remove();rej(1)};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.body.appendChild(s)})}
function post(o){return new Promise(r=>{const ifr=document.createElement("iframe");ifr.name="h"+Date.now();ifr.style.display="none";document.body.appendChild(ifr);const f=document.createElement("form");f.target=ifr.name;f.method="POST";f.action=API;f.style.display="none";Object.entries(o).forEach(([k,v])=>{const i=document.createElement("input");i.name=k;i.value=v;f.appendChild(i)});document.body.appendChild(f);f.submit();setTimeout(()=>{f.remove();ifr.remove();r()},900)})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function loadP(){const d=await j(API+"?action=list");if(!d.ok)return;products.innerHTML='<table><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Destacado</th><th>Acción</th></tr>'+d.products.map(x=>`<tr><td><b>${esc(x.name)}</b><br>${esc(x.desc)}</td><td><input id="p${x.id}" type="number" step=".01" value="${x.price}"></td><td><input id="s${x.id}" type="number" min="0" value="${x.stock}"></td><td><input id="c${x.id}" value="${esc(x.category||"Otros")}"></td><td><input id="f${x.id}" type="checkbox" ${x.featured?"checked":""}></td><td><button class="btn primary" onclick="saveP(${x.id})">Guardar</button> <button class="btn danger" onclick="delP(${x.id})">Eliminar</button></td></tr>`).join("")+'</table>'}
async function saveP(id){await post({action:"edit",password:pw,id,price:document.getElementById("p"+id).value,stock:document.getElementById("s"+id).value,category:document.getElementById("c"+id).value,featured:document.getElementById("f"+id).checked});msg("Guardado ✅");setTimeout(()=>{loadP();dash()},700)}
async function delP(id){if(!confirm("¿Eliminar producto?"))return;await post({action:"delete",password:pw,id});msg("Eliminado ✅");setTimeout(()=>{loadP();dash()},700)}
async function loadO(){const d=await j(API+"?action=orders&password="+encodeURIComponent(pw));if(!d.ok)return;orders.innerHTML='<table><tr><th>Pedido</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th></tr>'+d.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><br>${new Date(o.date).toLocaleString()}</td><td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address)}</td><td>${o.items.map(i=>esc(i.qty+" × "+i.name)).join("<br>")}</td><td>${Number(o.total).toFixed(2).replace(".",",")} €</td><td><select onchange="st('${esc(o.id)}',this.value)">${["pendiente","preparando","enviado","entregado","cancelado"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+'</table>'}
async function st(id,status){await post({action:"status",password:pw,id,status});msg("Estado actualizado ✅");setTimeout(loadO,700)}
async function dash(){try{const d=await j(API+"?action=dashboard&password="+encodeURIComponent(pw));if(d.ok){sales.textContent=Number(d.stats.sales).toFixed(2).replace(".",",")+" €";oc.textContent=d.stats.orders;pc.textContent=d.stats.products;ls.textContent=d.stats.low}}catch(e){}}
function msg(t){const e=document.getElementById("msg");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2500)}
document.getElementById("go").onclick=async()=>{pw=document.getElementById("pass").value;try{const d=await j(API+"?action=auth&password="+encodeURIComponent(pw));if(!d.ok){loginMsg.textContent="Contraseña incorrecta";loginMsg.classList.add("show");return}sessionStorage.setItem("mdt-admin-password",pw);login.classList.add("hidden");panel.classList.remove("hidden");dash();loadP()}catch(e){loginMsg.textContent="No se pudo conectar";loginMsg.classList.add("show")}};
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("mdt-admin-password");location.reload()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");pTab.classList.toggle("hidden",b.dataset.tab!=="p");oTab.classList.toggle("hidden",b.dataset.tab!=="o");if(b.dataset.tab==="o")loadO()});
document.getElementById("refreshP").onclick=loadP;document.getElementById("refreshO").onclick=loadO;
document.getElementById("add").onsubmit=async e=>{e.preventDefault();await post({action:"add",password:pw,name:n.value,price:pr.value,category:cat.value,stock:stock.value,emoji:emoji.value,image:img.value,desc:desc.value,featured:feat.checked});e.target.reset();msg("Producto añadido ✅");setTimeout(()=>{loadP();dash()},700)};
if(pw){login.classList.add("hidden");panel.classList.remove("hidden");dash();loadP()}
</script></body></html>
