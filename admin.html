<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Mercadillo del Tercio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f2;color:#171717}
.wrap{max-width:1200px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e4e4df;border-radius:18px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat{background:#fafafa;border:1px solid #eee;padding:12px;border-radius:12px}
.stat b{display:block;font-size:22px}
input,textarea,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:10px;font:inherit}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}
.primary{background:#111;color:#fff}
.danger{background:#ffe1e1;color:#900}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}
.tab.active{background:#111;color:#fff}
.hidden{display:none!important}
.table{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:top}
.msg{display:none;background:#eff7d7;padding:10px;border-radius:9px;margin-top:12px}
.msg.on{display:block}
.small{font-size:12px;color:#777}
@media(max-width:900px){.grid,.stats{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.grid,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h2>Mercadillo del Tercio · Admin</h2>
    <button id="logoutBtn" class="btn">Salir</button>
  </div>

  <section id="loginBox" class="card">
    <h1>Panel de administración</h1>
    <p>Introduce tu contraseña.</p>
    <input id="passwordInput" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn" class="btn primary" style="margin-top:10px">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="panelBox" class="hidden">
    <div id="mainMsg" class="msg"></div>

    <div class="card">
      <div class="stats">
        <div class="stat">Ventas<b id="salesStat">0 €</b></div>
        <div class="stat">Pedidos<b id="ordersStat">0</b></div>
        <div class="stat">Productos<b id="productsStat">0</b></div>
        <div class="stat">Poco stock<b id="lowStat">0</b></div>
        <div class="stat">Pendientes<b id="pendingStat">0</b></div>
        <div class="stat">Entregados<b id="deliveredStat">0</b></div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="productsTab">🛍️ Productos</button>
      <button class="tab" data-tab="ordersTab">📦 Historial y estados</button>
      <button class="tab" data-tab="couponsTab">🎟️ Cupones</button>
    </div>

    <section id="productsTab">
      <div class="card">
        <h2>Añadir producto</h2>
        <form id="addProductForm">
          <div class="grid">
            <label>Nombre<input required id="productName"></label>
            <label>Precio<input required id="productPrice" type="number" min="0" step="0.01"></label>
            <label>Precio anterior<input id="productOldPrice" type="number" min="0" step="0.01"></label>
            <label>Categoría<input id="productCategory" placeholder="Pulseras"></label>
            <label>Stock<input required id="productStock" type="number" min="0" step="1"></label>
            <label>Emoji<input id="productEmoji" placeholder="📿"></label>
            <label>Foto URL<input id="productImage" placeholder="https://..."></label>
          </div>
          <label>Descripción<textarea id="productDesc" rows="2"></textarea></label>
          <label><input id="productFeatured" type="checkbox" style="width:auto"> Destacado</label>
          <label><input id="productNew" type="checkbox" checked style="width:auto"> Nuevo</label>
          <br>
          <button class="btn primary" type="submit">Añadir producto</button>
        </form>
      </div>

      <div class="card">
        <h2>Productos</h2>
        <div id="productsTable" class="table">Cargando…</div>
      </div>
    </section>

    <section id="ordersTab" class="hidden">
      <div class="card">
        <h2>Historial de pedidos</h2>
        <div id="ordersTable" class="table">Cargando…</div>
      </div>
    </section>

    <section id="couponsTab" class="hidden">
      <div class="card">
        <h2>Cupones</h2>
        <form id="couponForm" class="grid">
          <label>Código<input required id="couponCode" placeholder="TERCIO10"></label>
          <label>Tipo<select id="couponType"><option value="percent">%</option><option value="fixed">€</option></select></label>
          <label>Valor<input required id="couponValue" type="number" min="0" step="0.01"></label>
          <div><br><button class="btn primary" type="submit">Añadir</button></div>
        </form>
        <div id="couponsTable" class="table" style="margin-top:15px"></div>
      </div>
    </section>
  </section>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwbwCPAaHm83HLa119PATjGNv47aF8_5I6Bl8PVzFWfNz8BLe99-VINh3l9AlOP0bTw6A/exec";

const els = {
  loginBox: document.getElementById("loginBox"),
  panelBox: document.getElementById("panelBox"),
  passwordInput: document.getElementById("passwordInput"),
  loginBtn: document.getElementById("loginBtn"),
  loginMsg: document.getElementById("loginMsg"),
  logoutBtn: document.getElementById("logoutBtn"),
  mainMsg: document.getElementById("mainMsg"),
  salesStat: document.getElementById("salesStat"),
  ordersStat: document.getElementById("ordersStat"),
  productsStat: document.getElementById("productsStat"),
  lowStat: document.getElementById("lowStat"),
  pendingStat: document.getElementById("pendingStat"),
  deliveredStat: document.getElementById("deliveredStat"),
  productsTable: document.getElementById("productsTable"),
  ordersTable: document.getElementById("ordersTable"),
  couponsTable: document.getElementById("couponsTable")
};

let password = sessionStorage.getItem("mdt-pw") || "";

function showLoginMessage(text) {
  els.loginMsg.textContent = text;
  els.loginMsg.classList.add("on");
}

function showMainMessage(text) {
  els.mainMsg.textContent = text;
  els.mainMsg.classList.add("on");
  setTimeout(() => els.mainMsg.classList.remove("on"), 2500);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, function (m) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m];
  });
}

function jsonp(url) {
  return new Promise(function (resolve, reject) {
    const callbackName = "mdtAdmin_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let timer = null;

    function cleanup() {
      if (timer) clearTimeout(timer);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function (data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function () {
      cleanup();
      reject(new Error("No se pudo conectar con Google Apps Script."));
    };

    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + callbackName;
    document.body.appendChild(script);

    timer = setTimeout(function () {
      cleanup();
      reject(new Error("Tiempo de espera agotado."));
    }, 10000);
  });
}

function postData(payload) {
  return fetch(API, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  });
}

async function login() {
  const value = els.passwordInput.value.trim();
  if (!value) {
    showLoginMessage("Escribe la contraseña.");
    return;
  }

  els.loginBtn.disabled = true;
  els.loginBtn.textContent = "Entrando…";

  try {
    const data = await jsonp(API + "?action=auth&password=" + encodeURIComponent(value));

    if (!data || data.ok !== true) {
      showLoginMessage("La contraseña no coincide.");
      return;
    }

    password = value;
    sessionStorage.setItem("mdt-pw", password);
    els.loginBox.classList.add("hidden");
    els.panelBox.classList.remove("hidden");

    await refreshDashboard();
    await loadProducts();
  } catch (error) {
    console.error(error);
    showLoginMessage("No se pudo conectar con el servidor.");
  } finally {
    els.loginBtn.disabled = false;
    els.loginBtn.textContent = "Entrar";
  }
}

async function refreshDashboard() {
  const data = await jsonp(API + "?action=dashboard&password=" + encodeURIComponent(password));
  if (!data || data.ok !== true) return;

  els.salesStat.textContent = Number(data.stats.sales || 0).toFixed(2).replace(".", ",") + " €";
  els.ordersStat.textContent = data.stats.orders || 0;
  els.productsStat.textContent = data.stats.products || 0;
  els.lowStat.textContent = data.stats.low || 0;
  els.pendingStat.textContent = data.stats.pending || 0;
  els.deliveredStat.textContent = data.stats.delivered || 0;
}

async function loadProducts() {
  const data = await jsonp(API + "?action=list");
  if (!data || data.ok !== true) throw new Error("No se pudieron cargar los productos.");

  els.productsTable.innerHTML =
    "<table><thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Acciones</th></tr></thead><tbody>" +
    data.products.map(function (product) {
      return "<tr>" +
        "<td><b>" + escapeHtml(product.name) + "</b><br><span class='small'>" + escapeHtml(product.desc || "") + "</span></td>" +
        "<td><input id='price_" + product.id + "' type='number' step='0.01' value='" + Number(product.price || 0) + "'></td>" +
        "<td><input id='stock_" + product.id + "' type='number' min='0' step='1' value='" + Number(product.stock || 0) + "'></td>" +
        "<td><input id='category_" + product.id + "' value='" + escapeHtml(product.category || "Otros") + "'></td>" +
        "<td><button class='btn primary' onclick='saveProduct(" + product.id + ")'>Guardar</button> " +
        "<button class='btn danger' onclick='deleteProduct(" + product.id + ")'>Eliminar</button></td>" +
      "</tr>";
    }).join("") +
    "</tbody></table>";
}

async function saveProduct(id) {
  await postData({
    action: "edit",
    password: password,
    id: id,
    price: document.getElementById("price_" + id).value,
    stock: document.getElementById("stock_" + id).value,
    category: document.getElementById("category_" + id).value
  });
  showMainMessage("Producto guardado ✅");
  setTimeout(function () { refreshDashboard(); loadProducts(); }, 700);
}

async function deleteProduct(id) {
  if (!confirm("¿Eliminar este producto?")) return;
  await postData({action:"delete", password:password, id:id});
  showMainMessage("Producto eliminado ✅");
  setTimeout(function () { refreshDashboard(); loadProducts(); }, 700);
}

async function loadOrders() {
  const data = await jsonp(API + "?action=orders&password=" + encodeURIComponent(password));
  if (!data || data.ok !== true) throw new Error("No se pudieron cargar los pedidos.");

  els.ordersTable.innerHTML =
    "<table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>" +
    data.orders.map(function (order) {
      const options = ["pendiente","preparando","enviado","entregado","cancelado"].map(function (status) {
        return "<option " + (order.status === status ? "selected" : "") + ">" + status + "</option>";
      }).join("");

      return "<tr>" +
        "<td><b>" + escapeHtml(order.id) + "</b><br><span class='small'>" + new Date(order.date).toLocaleString() + "</span></td>" +
        "<td>" + escapeHtml(order.name) + "<br>" + escapeHtml(order.phone) + "<br>" + escapeHtml(order.address) + "</td>" +
        "<td>" + Number(order.total || 0).toFixed(2).replace(".", ",") + " €</td>" +
        "<td><select onchange='changeStatus(" + JSON.stringify(order.id) + ", this.value)'>" + options + "</select></td>" +
      "</tr>";
    }).join("") +
    "</tbody></table>";
}

async function changeStatus(id, status) {
  await postData({action:"status", password:password, id:id, status:status});
  showMainMessage("Estado actualizado ✅");
  setTimeout(function () { loadOrders(); refreshDashboard(); }, 700);
}

async function loadCoupons() {
  const data = await jsonp(API + "?action=list");
  if (!data || data.ok !== true) throw new Error("No se pudieron cargar los cupones.");

  els.couponsTable.innerHTML =
    "<table><thead><tr><th>Código</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>" +
    data.coupons.map(function (coupon) {
      return "<tr><td>" + escapeHtml(coupon.code) + "</td><td>" +
        escapeHtml(coupon.type) + "</td><td>" + Number(coupon.value || 0) + "</td></tr>";
    }).join("") +
    "</tbody></table>";
}

async function refreshAll() {
  await refreshDashboard();
  await loadProducts();
}

els.loginBtn.addEventListener("click", login);
els.passwordInput.addEventListener("keydown", function (event) {
  if (event.key === "Enter") login();
});

els.logoutBtn.addEventListener("click", function () {
  sessionStorage.removeItem("mdt-pw");
  location.reload();
});

document.querySelectorAll(".tab").forEach(function (button) {
  button.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.remove("active"); });
    button.classList.add("active");

    document.getElementById("productsTab").classList.toggle("hidden", button.dataset.tab !== "productsTab");
    document.getElementById("ordersTab").classList.toggle("hidden", button.dataset.tab !== "ordersTab");
    document.getElementById("couponsTab").classList.toggle("hidden", button.dataset.tab !== "couponsTab");

    if (button.dataset.tab === "ordersTab") loadOrders();
    if (button.dataset.tab === "couponsTab") loadCoupons();
  });
});

document.getElementById("addProductForm").addEventListener("submit", async function (event) {
  event.preventDefault();

  await postData({
    action:"add",
    password:password,
    name:document.getElementById("productName").value,
    price:document.getElementById("productPrice").value,
    oldPrice:document.getElementById("productOldPrice").value,
    category:document.getElementById("productCategory").value,
    stock:document.getElementById("productStock").value,
    emoji:document.getElementById("productEmoji").value,
    image:document.getElementById("productImage").value,
    desc:document.getElementById("productDesc").value,
    featured:document.getElementById("productFeatured").checked,
    isNew:document.getElementById("productNew").checked
  });

  event.target.reset();
  document.getElementById("productNew").checked = true;
  showMainMessage("Producto añadido ✅");
  setTimeout(function () { refreshAll(); }, 700);
});

document.getElementById("couponForm").addEventListener("submit", async function (event) {
  event.preventDefault();

  await postData({
    action:"couponAdd",
    password:password,
    code:document.getElementById("couponCode").value,
    type:document.getElementById("couponType").value,
    value:document.getElementById("couponValue").value
  });

  event.target.reset();
  showMainMessage("Cupón añadido ✅");
  setTimeout(function () { loadCoupons(); }, 700);
});

if (password) {
  els.loginBox.classList.add("hidden");
  els.panelBox.classList.remove("hidden");
  refreshAll().catch(function (error) {
    console.error(error);
  });
}
</script>
</body>
</html>
